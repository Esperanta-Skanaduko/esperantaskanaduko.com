name: "\U0001F4DA Suggest a Resource"
description: Suggest an Esperanto book, tool, learning material, or cultural resource to add to the site.
title: "[Resource] "
labels:
  - resource-suggestion
assignees:
  - Vaporjawn

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping grow the Esperanta Skanduko library! ✨

        Please fill in the details below. The more context you provide, the easier it is to review and add your suggestion.

  - type: input
    id: resource_name
    attributes:
      label: Resource name
      description: The name of the book, website, tool, or content you are suggesting.
      placeholder: "e.g. Lernu.net, La Hobito, Esperanto Duolingo course"
    validations:
      required: true

  - type: input
    id: resource_url
    attributes:
      label: URL / source
      description: A direct link to the resource, if available.
      placeholder: "https://..."
    validations:
      required: false

  - type: dropdown
    id: resource_type
    attributes:
      label: Resource type
      description: What category best describes this resource?
      options:
        - "Learning / Grammar"
        - "Book / Literature (public domain)"
        - "Book / Literature (copyrighted)"
        - "Audio / Podcast"
        - "Video / YouTube"
        - "Music"
        - "Community / Forum"
        - "Tool / Software"
        - "Event / Organization"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Why should this be included?
      description: |
        What makes this resource valuable for Esperanto learners or the community?
        Who would benefit from it? What level is it aimed at (beginner, intermediate, advanced)?
      placeholder: |
        This resource is useful because...
        It is particularly helpful for...
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Available in Esperanto?
      description: Is this resource fully in Esperanto, partially in Esperanto, or about Esperanto?
      options:
        - "Yes — fully in Esperanto"
        - "Partially — bilingual or parallel text"
        - "No — about Esperanto but in another language"
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License / availability
      description: Check all that apply.
      options:
        - label: This resource is free to access without registration
        - label: This resource appears to be in the public domain (50+ years after author's death)
        - label: This resource is open source or has an open license (e.g. CC, MIT)

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Anything else you would like to add — author, year, related resources, etc.
    validations:
      required: false

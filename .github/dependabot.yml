# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
#   • npm packages   — weekly on Monday (grouped by ecosystem)
#   • GitHub Actions — monthly on the 1st
#   • Major version bumps for MUI and Firebase are ignored; they require
#     manual migration due to breaking changes.

version: 2

updates:
  # ─── npm dependencies ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    reviewers:
      - Vaporjawn
    assignees:
      - Vaporjawn
    labels:
      - dependencies

    # Ignore major version bumps for libs with historically large breaking changes.
    ignore:
      - dependency-name: '@mui/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@emotion/*'
        update-types: ['version-update:semver-major']
      - dependency-name: firebase
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite-plugin-pwa'
        update-types: ['version-update:semver-major']

    # Group related packages into a single PR to reduce noise.
    groups:
      mui:
        patterns:
          - '@mui/*'
          - '@emotion/*'
      firebase:
        patterns:
          - 'firebase'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-ecosystem:
        patterns:
          - 'react-router-dom'
          - 'react-helmet-async'
          - 'react-i18next'
      i18n:
        patterns:
          - 'i18next'
          - 'i18next-*'
          - 'react-i18next'
      testing:
        patterns:
          - '@testing-library/*'
          - 'jest'
          - 'jest-environment-jsdom'
          - 'babel-jest'
          - '@babel/*'
          - '@types/jest'
          - '@playwright/test'
      typescript:
        patterns:
          - 'typescript'
          - '@typescript-eslint/*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'rollup-*'
          - 'vite-plugin-pwa'
          - 'workbox-*'
      sentry:
        patterns:
          - '@sentry/*'

  # ─── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: 1
      time: '09:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    reviewers:
      - Vaporjawn
    assignees:
      - Vaporjawn
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'

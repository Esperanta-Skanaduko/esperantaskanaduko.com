# CI / CD — Esperanta Skanduko
#
# JOBS
#   quality   Type-check, ESLint, Jest (all pushes + PRs)
#   build     Vite production build (all pushes + PRs for validation)
#   deploy    Push dist/ to GitHub Pages (main push only)
#
# FIRST-TIME SETUP (once per repo)
#   1. Settings → Pages → Source → "GitHub Actions"
#   2. Settings → Secrets and variables → Actions → add all VITE_FIREBASE_* secrets
#
# Secrets required for a working deployment (the build itself succeeds without
# them; only the running app in the browser needs real Firebase credentials):
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID   (optional — Analytics)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Quality checks ──────────────────────────────────────────────────────────
  # Runs on every push and every PR.
  # Firebase is fully mocked in Jest — no VITE_FIREBASE_* env vars required.
  quality:
    name: Type-check · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Jest (unit + integration, with coverage)
        run: npm run test:coverage
        env:
          CI: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7

  # ─── Production build ────────────────────────────────────────────────────────
  # Runs after quality checks pass, on all events.
  # • On PRs: validates that the Vite build succeeds (Firebase secrets may be
  #   empty for fork PRs; the build itself still succeeds because the Firebase
  #   env-var check in firebaseConfig.ts is runtime code, not build-time).
  # • On main push: pages artifact is uploaded for deployment.
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Upload the pages artifact only when we're going to deploy (main push).
      # The artifact is consumed by the deploy job below.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ─── Deploy to GitHub Pages ──────────────────────────────────────────────────
  # Runs only on push to main, after the build job succeeds.
  # Uses the OIDC-based GitHub Pages deployment (no gh-pages branch needed).
  deploy:
    name: Deploy → GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write      # required to deploy to Pages
      id-token: write   # required for OIDC token exchange

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
